<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PoopyWorld</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@500;700&display=swap">
<style>
  /* Layout: the game fills the screen; small pixel-framed panels float over it. Single dark "night garden" look by choice. */
  :root {
    --ground: #1b2a24;      /* behind the game canvas */
    --panel: #fff6e4;       /* parchment panels */
    --panel-edge: #3b2a1e;  /* dark wood frame */
    --ink: #2b1f17;
    --ink-soft: #6b5442;
    --leaf: #5fae4e;        /* accent: garden green */
    --font-pixel: "Pixelify Sans", "Courier New", monospace;
    --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--panel);
    font-family: var(--font-body);
    overflow: hidden;
    padding-left: max(0px, env(safe-area-inset-left, 0px));
    padding-right: max(0px, env(safe-area-inset-right, 0px));
  }
  #game { position: fixed; inset: 0; display: grid; place-items: center; }
  #game canvas { image-rendering: pixelated; }

  .panel {
    background: var(--panel);
    color: var(--ink);
    border: 3px solid var(--panel-edge);
    box-shadow: 0 0 0 3px var(--panel), 0 0 0 6px var(--panel-edge), 0 8px 0 6px rgba(0,0,0,.25);
    border-radius: 2px;
  }

  #hud {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    pointer-events: none;
  }
  #hud .badge { font-family: var(--font-pixel); font-weight: 700; font-size: 15px; padding: 4px 10px; }
  #hud .badge span { color: var(--leaf); }
  #hud .keys { font-size: 13px; padding: 4px 10px; color: var(--ink-soft); }
  kbd {
    font-family: var(--font-pixel); font-size: 12px; color: var(--ink);
    background: #f1e2c4; border: 2px solid var(--panel-edge); border-bottom-width: 3px;
    padding: 0 4px; border-radius: 2px;
  }

  #dialog {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    width: min(620px, calc(100% - 44px));
    padding: 14px 18px 12px;
  }
  #dialog .who { font-family: var(--font-pixel); font-weight: 700; font-size: 16px; color: var(--panel-edge); margin-bottom: 4px; }
  #dialog .text { font-size: 16px; line-height: 1.5; min-height: 3em; }
  #dialog .next { text-align: right; font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

  #start {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(12, 20, 16, .55);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #start .card { max-width: 420px; padding: 22px 24px; text-align: center; display: grid; gap: 12px; }
  #start h1 { margin: 0; font-family: var(--font-pixel); font-size: 34px; letter-spacing: .5px; color: var(--panel-edge); text-wrap: balance; }
  #start h1 span { color: var(--leaf); }
  #start p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--ink-soft); }
  #start button {
    justify-self: center;
    font-family: var(--font-pixel); font-weight: 700; font-size: 18px;
    color: var(--panel); background: var(--leaf);
    border: 3px solid var(--panel-edge); border-bottom-width: 6px;
    padding: 8px 28px; cursor: pointer; border-radius: 2px;
  }
  #start button:hover { filter: brightness(1.08); }
  #start button:active { border-bottom-width: 3px; transform: translateY(3px); }
  #start button:focus-visible { outline: 3px solid var(--panel); outline-offset: 3px; }
  #start .mobile-note { font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { #start button:active { transform: none; } }
</style>
</head>
<body>
  <div id="game"></div>

  <div id="hud" hidden>
    <div class="badge panel">Poopy<span>World</span></div>
    <div class="keys panel">Lopen <kbd>WASD</kbd> / <kbd>&larr;&uarr;&darr;&rarr;</kbd> &middot; Bekijken <kbd>E</kbd> / <kbd>spatie</kbd></div>
  </div>

  <div id="dialog" class="panel" hidden>
    <div class="who" id="dialog-who"></div>
    <div class="text" id="dialog-text"></div>
    <div class="next">verder met <kbd>E</kbd></div>
  </div>

  <div id="start">
    <div class="card panel">
      <h1>Poopy<span>World</span></h1>
      <p>Mijlpaal 1: de tuin van de villa. Loop rond en bekijk alles wat je tegenkomt.</p>
      <button id="start-btn" type="button">Spelen</button>
      <p class="mobile-note" id="mobile-note" hidden>Speel dit op je laptop. De joystick voor de telefoon komt later.</p>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
