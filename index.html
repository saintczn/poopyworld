<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PoopyWorld</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@600;700&display=swap">
<style>
  /* Layout: the game fills the screen; wooden, Stardew-like panels float over it. Single warm look by choice. */
  :root {
    --ground: #2d4a2b;
    --panel: #f6e3b4;        /* parchment */
    --panel-deep: #e8c98a;
    --wood: #8a4f24;         /* frame */
    --wood-dark: #4a2511;
    --ink: #3b200f;
    --ink-soft: #7a4e2a;
    --leaf: #5aa83f;
    --font-pixel: "Pixelify Sans", "Courier New", monospace;
    --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--panel); font-family: var(--font-body); overflow: hidden; }
  #game { position: fixed; inset: 0; display: grid; place-items: center; }
  #game canvas { image-rendering: pixelated; }

  .panel {
    background: linear-gradient(var(--panel), var(--panel)) padding-box;
    color: var(--ink);
    border: 4px solid var(--wood);
    border-radius: 6px;
    box-shadow: inset 0 0 0 2px var(--panel-deep), 0 0 0 3px var(--wood-dark), 0 6px 0 3px rgba(0,0,0,.3);
  }

  #hud {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    pointer-events: none;
  }
  #hud .badge { font-family: var(--font-pixel); font-weight: 700; font-size: 16px; padding: 4px 12px; }
  #hud .badge span { color: var(--leaf); }
  #hud .keys { font-size: 13px; font-weight: 600; padding: 5px 12px; color: var(--ink-soft); }
  kbd {
    font-family: var(--font-pixel); font-size: 12px; color: var(--ink);
    background: #fff4d6; border: 2px solid var(--wood-dark); border-bottom-width: 3px;
    padding: 0 4px; border-radius: 3px;
  }

  #dialog {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    width: min(680px, calc(100% - 48px));
    padding: 14px 20px 12px;
  }
  #dialog .who {
    display: inline-block; font-family: var(--font-pixel); font-weight: 700; font-size: 16px;
    color: var(--panel); background: var(--wood); padding: 2px 10px; border-radius: 4px; margin-bottom: 8px;
  }
  #dialog .text { font-size: 17px; font-weight: 600; line-height: 1.5; min-height: 3em; }
  #dialog .next { text-align: right; font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

  #start {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(20, 30, 14, .45);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #start .card { max-width: 440px; padding: 24px 26px; text-align: center; display: grid; gap: 12px; }
  #start h1 { margin: 0; font-family: var(--font-pixel); font-size: 38px; color: var(--wood); text-wrap: balance; text-shadow: 0 2px 0 var(--panel-deep); }
  #start h1 span { color: var(--leaf); }
  #start p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--ink-soft); font-weight: 600; }
  #start button {
    justify-self: center; font-family: var(--font-pixel); font-weight: 700; font-size: 19px;
    color: #fff; background: var(--leaf);
    border: 3px solid var(--wood-dark); border-bottom-width: 6px;
    padding: 8px 30px; cursor: pointer; border-radius: 6px;
  }
  #start button:hover { filter: brightness(1.08); }
  #start button:active { border-bottom-width: 3px; transform: translateY(3px); }
  #start button:focus-visible { outline: 3px solid var(--panel); outline-offset: 3px; }
  #start .small { font-size: 12px; font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { #start button:active { transform: none; } }
</style>
</head>
<body>
  <div id="game"></div>

  <div id="hud" hidden>
    <div class="badge panel">Poopy<span>World</span></div>
    <div class="keys panel">Lopen <kbd>WASD</kbd> / <kbd>&larr;&uarr;&darr;&rarr;</kbd> &middot; Bekijken <kbd>E</kbd> / <kbd>spatie</kbd></div>
  </div>

  <div id="dialog" class="panel" hidden>
    <div class="who" id="dialog-who"></div>
    <div class="text" id="dialog-text"></div>
    <div class="next">verder met <kbd>E</kbd></div>
  </div>

  <div id="start">
    <div class="card panel">
      <h1>Poopy<span>World</span></h1>
      <p>De tuin van jullie huis. Loop rond en bekijk alles wat je tegenkomt.</p>
      <button id="start-btn" type="button">Spelen</button>
      <p class="small" id="mobile-note" hidden>Speel dit op je laptop. De joystick voor de telefoon komt later.</p>
      <p class="small">Pixelart: LPC Revised (Eliza Wyatt e.a.), OGA-BY 3.0</p>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
